<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>girlbot</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- login gate (only when Google auth is on and you're signed out) -->
  <div id="gate" class="gate" style="display:none">
    <div class="gate-card">
      <h1>girlbot</h1>
      <p class="tag">ur bestie who's been taking notes</p>
      <p class="hint">sign in so ur chats stay saved n private to u</p>
      <a class="gbtn" href="/auth/login"><span class="g">G</span> Sign in with Google</a>
    </div>
  </div>

  <div class="screen" id="appwrap" style="display:none">
    <div class="mac-window">
      <!-- title bar -->
      <div class="titlebar">
        <div class="lights"><span class="l red"></span><span class="l yellow"></span><span class="l green"></span></div>
        <div class="convo-header">
          <div class="avatar">💬</div>
          <div class="name">girlbot</div>
          <div class="presence" id="presence"></div>
        </div>
        <div class="titlebar-actions">
          <button class="i-btn" id="infoBtn" title="options" aria-label="options">ⓘ</button>
          <a class="i-btn" href="/settings.html" title="settings">⚙︎</a>
        </div>
      </div>

      <!-- ⓘ options drawer -->
      <div class="info-panel" id="infoPanel" hidden>
        <div class="slider-box">
          <label for="reliance">how should I decide? — <span id="relianceLabel"></span></label>
          <input type="range" id="reliance" min="0" max="100" value="60" />
          <div class="ends"><span>outside research</span><span>her data</span></div>
        </div>
        <div class="info-row">
          <label class="toggle"><input type="checkbox" id="useResearch" checked /> pull research</label>
          <button class="secondary small" id="clearMem">clear chat</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <!-- messages -->
      <div id="chat" class="thread"></div>

      <!-- composer -->
      <div class="composer">
        <div class="input-pill"><textarea id="q" rows="1" placeholder="iMessage"></textarea></div>
        <button id="send" class="send-btn" aria-label="send">↑</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
